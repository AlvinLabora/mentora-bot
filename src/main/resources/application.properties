spring.application.name=mentora-bot

#----------------------------------------------------
#	DB CONNECTION
#----------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/mentoradb
spring.datasource.username=${"username"}
spring.datasource.password=${"password"}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#----------------------------------------------------
#	TELEGRAM CONFIGURATION
#----------------------------------------------------
telegrambotconnection.service.props.telegramUsername=${"telegramUsername"}
telegrambotconnection.service.props.telemgramToken=${"telemgramToken"}

#----------------------------------------------------
#	OPENROUTER CONFIGURATION
#----------------------------------------------------
openrouter.service.props.apiUrl=${"apiUrl"}
openrouter.service.props.apiKey=${"apiKey"}
openrouter.service.props.models[0]=${"models"}
openrouter.service.props.models[1]=${"models"}
openrouter.service.props.models[2]=${"models"}
openrouter.service.props.models[3]=${"models"}
openrouter.service.props.models[4]=${"models"}
openrouter.service.props.models[5]=${"models"}
